[project]
name = "vnexis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GwonilJoo", email = "gwonil3256@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "dependency-injector>=4.49.1",
    "fastapi[standard]>=0.135.1",
    "sqlalchemy[asyncio]>=2.0.52",
]

[project.scripts]
vnexis = "vnexis:main"
vnexis-api = "vnexis.api_main:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.19.1",
]
