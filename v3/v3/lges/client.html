<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .video-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        video {
            width: 100%;
            display: block;
            min-height: 400px;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #startBtn { background: #0f3460; }
        #stopBtn { background: #e94560; }
        #status {
            text-align: center;
            margin-top: 15px;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            color: #aaa;
            background: #0f3460;
        }
        #status.connected { background: #1b5e20; color: #a5d6a7; }
        #status.error { background: #b71c1c; color: #ef9a9a; }
        #status.connecting { background: #e65100; color: #ffcc80; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC Video Stream</h1>
        <div class="video-wrapper">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <div class="controls">
            <button id="startBtn" onclick="start()">Start</button>
            <button id="stopBtn" onclick="stop()" disabled>Stop</button>
        </div>
        <div id="status">Ready</div>
    </div>

    <script>
        let pc = null;
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');

        function setStatus(msg, type) {
            status.textContent = msg;
            status.className = type || '';
        }

        async function start() {
            try {
                startBtn.disabled = true;
                setStatus('Connecting...', 'connecting');

                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                pc.ontrack = (e) => {
                    if (e.track.kind === 'video') {
                        video.srcObject = e.streams[0];
                        setStatus('Connected', 'connected');
                        stopBtn.disabled = false;
                    }
                };

                pc.onconnectionstatechange = () => {
                    if (pc.connectionState === 'failed') {
                        setStatus('Connection failed', 'error');
                        stop();
                    } else if (pc.connectionState === 'disconnected') {
                        setStatus('Disconnected', 'error');
                    }
                };

                pc.addTransceiver('video', { direction: 'recvonly' });

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const res = await fetch('/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: offer.sdp, type: offer.type })
                });

                if (!res.ok) throw new Error(`Server error: ${res.status}`);

                const answer = await res.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            } catch (err) {
                setStatus(`Error: ${err.message}`, 'error');
                startBtn.disabled = false;
                stop();
            }
        }

        function stop() {
            if (pc) { pc.close(); pc = null; }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            setStatus('Ready', '');
        }

        window.addEventListener('beforeunload', stop);
    </script>
</body>
</html>
